# =============================================================================
# @file    build-sphinx.yml
# @brief   GitHub Actions workflow to build the DIBS docs with Sphinx
# @author  Michael Hucka <mhucka@caltech.edu>
# @license Please see the file named LICENSE in the project directory
# @website https://github.com/caltechlibrary/dibs
#
# Builds with the shared build-sphinx action from caltechlibrary/workflows,
# using the dependencies in docs/requirements.txt, and publishes the result
# with GitHub Pages. Pull requests get a build check but are not deployed.
# Pages must be set to deploy from GitHub Actions in the repository settings.
# =============================================================================

name: Update docs on GitHub

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: caltechlibrary/workflows/.github/actions/build-sphinx@v1
        with:
          requirements: docs/requirements.txt
          python-version: "3.12"

      - uses: caltechlibrary/workflows/.github/actions/deploy-site@v1
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
